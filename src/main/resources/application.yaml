server:
  port: 8083

spring:
  application:
    name: admin.service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parko_db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:parko-2271f}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:/run/secrets/firebase_credentials}

parking:
  visitor-entry-fee: ${PARKING_VISITOR_ENTRY_FEE:3000}

vehicles:
  max-active-per-user: ${VEHICLES_MAX_ACTIVE_PER_USER:3}
